name: web-ci

on:
  pull_request:
    paths:
      - 'web/**'
      # El núcleo de las edge functions se testea con el vitest de web.
      - 'supabase/functions/**'
      # Web lintea y testea los scripts de la raíz.
      - 'scripts/**'
      # Web testea y lintea la lógica que comparte con mobile.
      - 'shared/**'
      # Los contract tests de web leen contracts/*.json.
      - 'contracts/**'
      - '.github/workflows/web-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check src
      - run: npm test
