# Al mergear un release a main, lee las versiones de web/package.json y
# mobile/app.json y, para cada app cuyo tag <app>-vX.Y.Z no exista todavía,
# crea el tag sobre el commit pusheado y el GitHub Release con las notas
# extraídas de CHANGELOG.md (headers `### Web X.Y.Z` / `### Mobile X.Y.Z
# (versionCode N)` como anclas — ver CHANGELOG.md).
#
# Idempotente: un push a main sin bump de versión no hace nada; si un run
# anterior quedó a medias (tag sin release), lo completa sin retaggear.
# Los tags pusheados con GITHUB_TOKEN no disparan otros workflows.
#
# Prueba sin release real: workflow_dispatch con dry_run=true (default) desde
# cualquier branch — loguea qué haría sin crear nada. Con dry_run=false solo
# actúa sobre main (guarda anti-tag-de-staging).
name: release-tags

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar qué haría, sin crear tags ni releases"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            title: Web
            version_file: web/package.json
            version_query: .version
          - app: mobile
            title: Mobile
            version_file: mobile/app.json
            version_query: .expo.version
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión
        id: version
        run: |
          VERSION="$(jq -r '${{ matrix.version_query }}' '${{ matrix.version_file }}')"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::No pude leer la versión de ${{ matrix.version_file }}"
            exit 1
          fi
          TITLE="${{ matrix.title }} ${VERSION}"
          if [ "${{ matrix.app }}" = "mobile" ]; then
            VCODE="$(jq -r '.expo.android.versionCode' mobile/app.json)"
            TITLE="${TITLE} (versionCode ${VCODE})"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${{ matrix.app }}-v${VERSION}"
            echo "title=${TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Ver qué falta (tag / release)
        id: estado
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=all" >> "$GITHUB_OUTPUT"
            echo "Release $TAG ya existe — nada que hacer."
          elif git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "skip=tag" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG existe sin release — solo falta el release."
          else
            echo "skip=none" >> "$GITHUB_OUTPUT"
            echo "No existe $TAG — crear tag + release."
          fi

      - name: Extraer notas del CHANGELOG
        if: steps.estado.outputs.skip != 'all'
        env:
          TITLE_VER: "${{ matrix.title }} ${{ steps.version.outputs.version }}"
        run: |
          awk -v h="### ${TITLE_VER}" '
            index($0, h) == 1 { grab = 1; next }
            grab && (/^## / || /^### /) { exit }
            grab { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md no tiene una sección \"### ${TITLE_VER}\" con contenido. ¿Se bumpeó la versión sin pasar por /deploy? Completar el CHANGELOG o crear el release a mano: gh release create ${{ steps.version.outputs.tag }}"
            exit 1
          fi
          echo "--- notas para ${{ steps.version.outputs.tag }} ---"
          cat notes.md

      - name: Crear tag y release
        if: >-
          steps.estado.outputs.skip != 'all' &&
          (github.event_name == 'push' ||
           (inputs.dry_run == false && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          if [ "${{ steps.estado.outputs.skip }}" = "none" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --title "$TITLE" --notes-file notes.md
          echo "Release $TAG creado."

      - name: Dry-run — qué se habría hecho
        if: >-
          steps.estado.outputs.skip != 'all' &&
          github.event_name == 'workflow_dispatch' &&
          (inputs.dry_run == true || github.ref != 'refs/heads/main')
        run: |
          echo "(dry-run) Se crearía ${{ steps.version.outputs.tag }} — \"${{ steps.version.outputs.title }}\" (faltaba: ${{ steps.estado.outputs.skip == 'none' && 'tag + release' || 'solo release' }})."
