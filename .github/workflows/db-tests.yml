name: DB Tests

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'supabase/**'
      - '.github/workflows/db-tests.yml'

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: pgTAP (baseline + deltas)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Mismo pin que SUPABASE_CLI_VERSION en supabase/tests/lib.sh.
          version: 2.116.0

      - name: Run db test harness
        run: bash supabase/tests/run-db-tests.sh
